title: ConsentWise
description: Open Banking Live Account Testing
url: "https://consentwise.io"
baseurl: ""

# SEO (jekyll-seo-tag)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
logo: /assets/images/ConsentWise-1.svg
twitter:
  card: summary
social:
  name: ConsentWise
  links:
    - https://consentwise.io

# Collections
collections:
  services:
    output: true
    permalink: /:name/
  videos:
    output: true
    permalink: /videos/:name/
  guides:
    output: true
    permalink: /guides/:name/

defaults:
  - scope:
      path: ""
      type: services
    values:
      layout: service
  - scope:
      path: ""
      type: videos
    values:
      layout: video
  - scope:
      path: ""
      type: guides
    values:
      layout: guide

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  # Internal / developer files — never publish (see security incident write-up)
  - CLAUDE.md
  - CONTRIBUTING.md
  - SDLC.md
  - development_session_log
  - log
  - release-notes
  - scripts
  - tests
  - test-results
  - package.json
  - package-lock.json
  - playwright.config.js
  - public
  # Draft video page (placeholder youtube_id) not linked from anywhere on the site
  - _videos/open-banking-testing-best-practices.md

# Markdown
markdown: kramdown
