---
layout: default
---

<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{ page.title | escape }}",
    "description": "{{ page.description | escape }}",
    {% if page.date %}"datePublished": "{{ page.date | date_to_xmlschema }}",{% endif %}
    "author": {
      "@type": "Organization",
      "name": "ConsentWise"
    },
    "publisher": {
      "@type": "Organization",
      "name": "ConsentWise",
      "logo": {
        "@type": "ImageObject",
        "url": "https://consentwise.io/assets/images/ConsentWise-1.svg"
      }
    }
  }
</script>

<section class="ts-2" style="background-image: url('/assets/images/annie-spratt-FSFfEQkd1sc-unsplash.jpg');">
  <div class="table" style="width: 100%; height: 100%;">
    <div class="middle">
      <div class="main-page">
        <h1 data-aos="zoom-in-up" data-aos-duration="800" class="white m-0">{{ page.title }}</h1>
      </div>
    </div>
  </div>
</section>

<section>
  <div class="main-page">
    <div class="main-spacing">
      <div class="auto mw-1000">
        {{ content }}
      </div>
    </div>
  </div>
</section>

<section>
  <div class="bottom-cta">
    <div data-aos="zoom-in-up" data-aos-duration="800" class="main-page">
      <div class="main-padding mt">
        <div class="auto text-center">
          <h3 class="white">Get in touch with one of our team today</h3>
          <a class="btn pink-btn mt-es mb-0" href="https://open-banking.atlassian.net/servicedesk/customer/portal/1">Contact Us</a>
        </div>
      </div>
    </div>
  </div>
</section>
